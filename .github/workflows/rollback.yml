name: Roll back web production

on:
  workflow_dispatch:
    inputs:
      artifact:
        description: Vercel deployment URL/ID; leave empty to use the previous production deployment
        required: false
        type: string
      confirm:
        description: Type ROLLBACK
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-web
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation and inputs
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: test "$CONFIRM" = "ROLLBACK"

  web:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global vercel@59.10.0
      - name: Roll back Vercel alias
        env:
          ARTIFACT: ${{ inputs.artifact }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$ARTIFACT" ]; then
            vercel rollback "$ARTIFACT" --yes --token="$VERCEL_TOKEN"
          else
            vercel rollback --yes --token="$VERCEL_TOKEN"
          fi
