name: Roll back production

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment to roll back
        required: true
        type: choice
        options: [web, api]
      artifact:
        description: Vercel deployment URL/ID or Cloud Run revision; leave empty to use Vercel's previous production deployment
        required: false
        type: string
      confirm:
        description: Type ROLLBACK
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation and inputs
        env:
          ARTIFACT: ${{ inputs.artifact }}
          CONFIRM: ${{ inputs.confirm }}
          TARGET: ${{ inputs.target }}
        run: |
          test "$CONFIRM" = "ROLLBACK"
          if [ "$TARGET" = "api" ]; then test -n "$ARTIFACT"; fi

  web:
    needs: validate
    if: inputs.target == 'web'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global vercel@59.10.0
      - name: Roll back Vercel alias
        env:
          ARTIFACT: ${{ inputs.artifact }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$ARTIFACT" ]; then
            vercel rollback "$ARTIFACT" --yes --token="$VERCEL_TOKEN"
          else
            vercel rollback --yes --token="$VERCEL_TOKEN"
          fi

  api:
    needs: validate
    if: inputs.target == 'api'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Move all traffic to the selected revision
        env:
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          GCP_REGION: asia-south1
          REVISION: ${{ inputs.artifact }}
        run: gcloud run services update-traffic "$CLOUD_RUN_SERVICE" --region "$GCP_REGION" --to-revisions "$REVISION=100" --quiet
