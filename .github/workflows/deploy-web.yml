name: Deploy web

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-web
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release commit
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_AGORA_APP_ID: mock-agora-app-id
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_DEMO_MODE: "true"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - name: Reject a stale automated release
        if: github.event_name == 'workflow_run'
        run: |
          git fetch origin main:refs/remotes/origin/main --depth=1
          test "$RELEASE_SHA" = "$(git rev-parse origin/main)"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @roundcraft/contracts typecheck
      - run: pnpm --filter @roundcraft/config typecheck
      - run: pnpm --filter @roundcraft/config test
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web typecheck
      - run: pnpm --dir apps/web test

  deploy:
    name: Build, verify, and promote
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.10.0
      - name: Pull production configuration
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      - name: Validate required production variables
        run: |
          env_file=.vercel/.env.production.local
          test -s "$env_file"
          for key in NEXT_PUBLIC_API_BASE_URL NEXT_PUBLIC_AGORA_APP_ID NEXT_PUBLIC_DEMO_MODE NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY AGENT_BACKEND_URL; do
            grep -Eq "^${key}=.+" "$env_file" || { echo "Missing Vercel Production variable: $key" >&2; exit 1; }
          done
          grep -Eq '^NEXT_PUBLIC_DEMO_MODE="?false"?$' "$env_file" || { echo "NEXT_PUBLIC_DEMO_MODE must be false in Production" >&2; exit 1; }
      - name: Build production candidate
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      - name: Deploy candidate without the production alias
        id: candidate
        run: |
          url="$(vercel deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Smoke test candidate
        run: vercel curl / --deployment "${{ steps.candidate.outputs.url }}" --token="$VERCEL_TOKEN"
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Promote verified candidate
        run: vercel promote "${{ steps.candidate.outputs.url }}" --yes --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
