name: Deploy web

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-web
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release commit
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_AGORA_APP_ID: mock-agora-app-id
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_DEMO_MODE: "true"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      RELEASE_EVENT: ${{ github.event_name }}
      RELEASE_REF: ${{ github.ref }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - name: Require the current main release
        run: |
          if [ "$RELEASE_EVENT" = "workflow_dispatch" ]; then
            test "$RELEASE_REF" = "refs/heads/main"
          fi
          git fetch origin main:refs/remotes/origin/main --depth=1
          test "$RELEASE_SHA" = "$(git rev-parse origin/main)"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @roundcraft/contracts typecheck
      - run: pnpm --filter @roundcraft/config typecheck
      - run: pnpm --filter @roundcraft/config test
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web typecheck
      - run: pnpm --dir apps/web test

  deploy:
    name: Build, verify, and promote
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.10.0
      - name: Pull production configuration
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      - name: Validate required production variables
        run: node --experimental-strip-types ../../packages/config/src/validate-production-env.ts .vercel/.env.production.local
      - name: Build production candidate
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      - name: Deploy candidate without the production alias
        id: candidate
        run: |
          url="$(vercel deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Smoke test candidate
        run: vercel curl / --deployment "${{ steps.candidate.outputs.url }}" --token="$VERCEL_TOKEN"
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Smoke test backend readiness
        timeout-minutes: 20
        env:
          EXPECTED_RELEASE_SHA: ${{ env.RELEASE_SHA }}
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { resolve } from "node:path";
          import { pathToFileURL } from "node:url";

          const configModule = await import(
            pathToFileURL(resolve("../../packages/config/src/index.ts")).href
          );
          const environment = configModule.parseEnvFile(
            readFileSync(".vercel/.env.production.local", "utf8"),
          );
          const readyUrl = new URL("/health/ready", environment.AGENT_BACKEND_URL);
          const expectedSha = process.env.EXPECTED_RELEASE_SHA?.toLowerCase();
          if (!expectedSha || !/^[a-f0-9]{40}$/.test(expectedSha)) {
            throw new Error("Expected release SHA is unavailable");
          }
          let lastStatus = "unreachable";
          for (let attempt = 1; attempt <= 90; attempt += 1) {
            try {
              const response = await fetch(readyUrl, {
                headers: { accept: "application/json" },
                signal: AbortSignal.timeout(5000),
              });
              if (response.ok) {
                const payload = await response.json();
                const actualSha = String(payload.release_sha ?? "").toLowerCase();
                const sameRelease =
                  /^[a-f0-9]{7,40}$/.test(actualSha) &&
                  (expectedSha.startsWith(actualSha) || actualSha.startsWith(expectedSha));
                if (sameRelease) {
                  console.log("Production backend is ready at the expected release");
                  process.exit(0);
                }
                lastStatus = "ready at a different release";
              } else {
                lastStatus = `HTTP ${response.status}`;
              }
            } catch {
              lastStatus = "unreachable";
            }
            if (attempt < 90) await new Promise((resolveDelay) => setTimeout(resolveDelay, 5000));
          }
          throw new Error(`Production backend readiness failed: ${lastStatus}`);
          NODE
      - name: Promote verified candidate
        run: vercel promote "${{ steps.candidate.outputs.url }}" --yes --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
