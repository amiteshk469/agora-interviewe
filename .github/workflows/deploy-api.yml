name: Deploy API

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-api
  cancel-in-progress: false

env:
  GCP_REGION: asia-south1

jobs:
  verify:
    name: Verify release commit
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      AGORA_APP_CERTIFICATE: mock-certificate
      AGORA_APP_ID: mock-agora-app-id
      AGORA_CUSTOMER_ID: mock-customer-id
      AGORA_CUSTOMER_SECRET: mock-customer-secret
      AGORA_CUSTOM_LLM_URL: http://127.0.0.1:8000/llm/chat/completions
      AGORA_LLM_BEARER_SECRET: mock-llm-bearer-secret
      AGORA_MOCK_MODE: "true"
      AGORA_WEBHOOK_SECRET: mock-webhook-secret
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      DEV_AUTH_ENABLED: "true"
      ENVIRONMENT: test
      LLM_API_KEY: mock-llm-key
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      SUPABASE_ANON_KEY: mock-anon-key
      SUPABASE_SERVICE_ROLE_KEY: mock-service-role-key
      SUPABASE_URL: https://example.supabase.co
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - name: Reject a stale automated release
        if: github.event_name == 'workflow_run'
        run: |
          git fetch origin main:refs/remotes/origin/main --depth=1
          test "$RELEASE_SHA" = "$(git rev-parse origin/main)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
        working-directory: apps/api
      - run: uv run ruff check .
        working-directory: apps/api
      - run: uv run mypy app
        working-directory: apps/api
      - run: uv run pytest
        working-directory: apps/api

  deploy:
    name: Deploy candidate, migrate, and promote
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Validate the Agora custom LLM callback
        env:
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
        run: |
          llm_url="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --region "$GCP_REGION" --format=json | jq -r '.spec.template.spec.containers[0].env[] | select(.name == "AGORA_CUSTOM_LLM_URL") | .value')"
          case "$llm_url" in
            https://*/llm/chat/completions) ;;
            *) echo "AGORA_CUSTOM_LLM_URL must be a public HTTPS /llm/chat/completions URL" >&2; exit 1 ;;
          esac
          case "$llm_url" in
            *REPLACE*|*.example*|*.invalid*|*localhost*|*127.0.0.1*) echo "AGORA_CUSTOM_LLM_URL is not a public production callback" >&2; exit 1 ;;
          esac
      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
      - name: Build and push immutable image
        id: image
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
        run: |
          image="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${CLOUD_RUN_SERVICE}:${RELEASE_SHA}"
          docker build --file deploy/cloud-run/Dockerfile --tag "$image" apps/api
          docker push "$image"
          echo "uri=$image" >> "$GITHUB_OUTPUT"
      - name: Deploy zero-traffic candidate
        id: candidate
        env:
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          tag="candidate-${RELEASE_SHA::12}"
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --image "$IMAGE_URI" \
            --region "$GCP_REGION" \
            --no-traffic \
            --tag "$tag" \
            --quiet
          url="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --region "$GCP_REGION" --format=json | jq -r --arg tag "$tag" '.status.traffic[] | select(.tag == $tag) | .url')"
          test -n "$url"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Verify candidate process before migration
        run: curl --fail --show-error --retry 6 --retry-all-errors "${{ steps.candidate.outputs.url }}/health/live"
      - uses: supabase/setup-cli@v2
        with:
          version: 2.116.0
      - name: Preview database migration
        run: supabase db push --dry-run --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: Apply database migration
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: Verify candidate against migrated schema
        run: |
          curl --fail --show-error --retry 6 --retry-all-errors "${{ steps.candidate.outputs.url }}/health/live"
          curl --fail --show-error --retry 6 --retry-all-errors "${{ steps.candidate.outputs.url }}/health/ready"
      - name: Promote verified candidate
        env:
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          CANDIDATE_TAG: ${{ steps.candidate.outputs.tag }}
        run: gcloud run services update-traffic "$CLOUD_RUN_SERVICE" --region "$GCP_REGION" --to-tags "$CANDIDATE_TAG=100" --quiet
