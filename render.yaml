# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

services:
  - type: web
    name: roundcraft-api
    runtime: docker
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: ./apps/api
    autoDeployTrigger: checksPass
    healthCheckPath: /health/ready
    renderSubdomainPolicy: enabled
    maxShutdownDelaySeconds: 120
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEV_AUTH_ENABLED
        value: "false"
      - key: API_BASE_URL
        value: https://roundcraft-api.onrender.com
      - key: WEB_BASE_URL
        value: https://agora-interviewe-web.vercel.app
      - key: AGORA_AREA
        value: INDIA
      - key: AGORA_AGENT_IDLE_TIMEOUT_SECONDS
        value: "120"
      - key: AGORA_SESSION_EXPIRES_SECONDS
        value: "3600"
      - key: SUPABASE_STORAGE_DOCUMENTS_BUCKET
        value: candidate-documents
      - key: SUPABASE_STORAGE_ARTIFACTS_BUCKET
        value: session-artifacts
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: qwen/qwen3.8-27b
      - key: FIRECRAWL_BASE_URL
        value: https://api.firecrawl.dev/v2
      - key: WEB_SEARCH_ENABLED
        value: "true"
      - key: RECORDING_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        value: '["https://agora-interviewe-web.vercel.app"]'
      - key: AGORA_CUSTOM_LLM_URL
        value: https://roundcraft-api.onrender.com/llm/chat/completions
      - key: AGORA_APP_ID
        sync: false
      - key: AGORA_APP_CERTIFICATE
        sync: false
      - key: AGORA_WEBHOOK_SECRET
        sync: false
      - key: AGORA_LLM_BEARER_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
