apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: roundcraft-api
  labels:
    cloud.googleapis.com/location: asia-south1
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "20"
        autoscaling.knative.dev/minScale: "1"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 40
      serviceAccountName: roundcraft-api@PROJECT_ID.iam.gserviceaccount.com
      timeoutSeconds: 300
      containers:
        - image: asia-south1-docker.pkg.dev/PROJECT_ID/roundcraft/roundcraft-api:bootstrap
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health/live
              port: 8080
            failureThreshold: 12
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 2
          env:
            - name: ENVIRONMENT
              value: production
            - name: CORS_ORIGINS
              value: '["https://roundcraft.example"]'
            - name: AGORA_CONVOAI_BASE_URL
              value: https://api.agora.io/api/conversational-ai-agent/v2/projects
            - name: AGORA_CUSTOM_LLM_URL
              value: https://REPLACE_WITH_PUBLIC_API_HOST/llm/chat/completions
            - name: AGORA_AREA
              value: INDIA
            - name: AGORA_AGENT_IDLE_TIMEOUT_SECONDS
              value: "120"
            - name: AGORA_SESSION_EXPIRES_SECONDS
              value: "3600"
            - name: SUPABASE_STORAGE_DOCUMENTS_BUCKET
              value: candidate-documents
            - name: SUPABASE_STORAGE_ARTIFACTS_BUCKET
              value: session-artifacts
            - name: LLM_BASE_URL
              value: https://api.openai.com/v1
            - name: LLM_MODEL
              value: gpt-5-mini
            - name: EMBEDDING_BASE_URL
              value: https://api.openai.com/v1
            - name: EMBEDDING_MODEL
              value: text-embedding-3-small
            - name: WEB_SEARCH_BASE_URL
              value: https://api.search.brave.com/res/v1
            - name: WEB_SEARCH_ENABLED
              value: "false"
            - name: RECORDING_ENABLED
              value: "false"
            - name: JD_MAX_UPLOAD_BYTES
              value: "10485760"
            - name: AGORA_APP_ID
              valueFrom:
                secretKeyRef:
                  name: roundcraft-agora-app-id
                  key: latest
            - name: AGORA_APP_CERTIFICATE
              valueFrom:
                secretKeyRef:
                  name: roundcraft-agora-app-certificate
                  key: latest
            - name: AGORA_CUSTOMER_ID
              valueFrom:
                secretKeyRef:
                  name: roundcraft-agora-customer-id
                  key: latest
            - name: AGORA_CUSTOMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: roundcraft-agora-customer-secret
                  key: latest
            - name: AGORA_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: roundcraft-agora-webhook-secret
                  key: latest
            - name: AGORA_LLM_BEARER_SECRET
              valueFrom:
                secretKeyRef:
                  name: roundcraft-agora-llm-bearer-secret
                  key: latest
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: roundcraft-supabase-url
                  key: latest
            - name: SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: roundcraft-supabase-anon-key
                  key: latest
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: roundcraft-supabase-service-role-key
                  key: latest
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: roundcraft-database-url
                  key: latest
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: roundcraft-llm-api-key
                  key: latest
            - name: EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: roundcraft-embedding-api-key
                  key: latest
  traffic:
    - percent: 100
      latestRevision: true
